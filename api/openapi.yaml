openapi: 3.1.0
info:
  title: Созвездие API
  version: 0.1.0
  description: |
    API MVP: вход по SMS, проекты и бриф, подбор команды, приглашения, админка сотрудников (/admin/*).
    Реализация — Route Handlers Next.js в `src/app/api`, логика — `src/server`, БД — PostgreSQL (`db/`).
    Сессия — httpOnly cookie `sz_session` (30 дней). Изменяющие запросы — только JSON и только со своего сайта (проверка Origin).
    Ошибки всегда в формате `{ "error": { "message": "...", "code": "..." } }`; message можно показывать пользователю.
servers:
  - url: /api

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sz_session
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            code: { type: string, description: "Машинный код: no_account, already_registered, too_soon, wrong_code, locked, invited, stale, not_filled …" }
    Me:
      type: object
      required: [user, profile]
      properties:
        staffRole: { type: ["string", "null"], enum: [admin, moderator, matcher, null], description: "Роль сотрудника платформы; null — обычный пользователь" }
        user:
          type: object
          properties: { id: { type: string, format: uuid }, phone: { type: string, example: "+79991234567" } }
        profile:
          oneOf:
            - type: "null"
            - type: object
              properties:
                displayName: { type: string }
                slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9_-]{1,30}[a-z0-9])$" }
                clientMode: { type: boolean }
                specialistMode: { type: boolean }
                avatarUrl: { type: [string, "null"], description: "/avatars/<preset>.webp или /api/media/<id>; null — показываем инициалы" }
    AvatarRef:
      oneOf:
        - type: "null"
        - type: object
          required: [kind, preset]
          properties:
            kind: { const: preset }
            preset: { $ref: "#/components/schemas/AvatarPreset" }
        - type: object
          required: [kind, mediaId]
          properties:
            kind: { const: upload }
            mediaId: { type: string, format: uuid }
    AvatarPreset:
      type: string
      enum: [director, camera, producer, writer, editor, colorist, sound, gaffer, art, makeup, actor, clapper]
    AvatarResponse:
      type: object
      required: [avatar, avatarUrl]
      properties:
        avatar: { $ref: "#/components/schemas/AvatarRef" }
        avatarUrl: { type: [string, "null"] }
    ImageUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "JPEG, PNG, WebP или AVIF, до 10 МБ. Сервер пересобирает в WebP и удаляет метаданные" }
    RoleSlot:
      type: object
      required: [key, roleId, levelMin, qty, shifts, budget, mustHave]
      properties:
        key: { type: string, description: "id слота (uuid) после сохранения; для новых строк — любой локальный ключ" }
        roleId: { type: string, enum: [director, dop, gaffer, sound, art, producer, writer, editor, colorist] }
        levelMin: { type: string, enum: [any, junior, middle, senior, lead] }
        qty: { type: integer, minimum: 1, maximum: 20 }
        shifts: { type: integer, minimum: 0, maximum: 60 }
        budget: { type: [integer, "null"], description: "На роль целиком, ₽. null — «рассчитаем» по типовым долям" }
        mustHave: { type: boolean }
    Brief:
      type: object
      description: Бриф проекта. Коды справочников — как в db/seeds/0001_dictionaries.sql.
      required: [title, city, formatId, goal, prepStart, shootDates, deliveryDate, slots, budgetMin, budgetMax, budgetFlex, budgetScope, legal, styleTagIds, references, workStyle, consent]
      properties:
        title: { type: string, maxLength: 120 }
        city: { type: string, example: Санкт-Петербург }
        formatId: { type: string, example: ad }
        goal: { type: string }
        prepStart: { type: string, description: "YYYY-MM-DD или пусто" }
        shootDates: { type: array, items: { type: string, format: date }, maxItems: 30 }
        deliveryDate: { type: string, description: "YYYY-MM-DD или пусто" }
        slots: { type: array, items: { $ref: "#/components/schemas/RoleSlot" }, maxItems: 20 }
        budgetMin: { type: [integer, "null"] }
        budgetMax: { type: [integer, "null"] }
        budgetFlex: { type: string, enum: [strict, pm15, negotiable] }
        budgetScope: { type: string, enum: [fees, fees_equipment] }
        legal: { type: array, items: { type: string, enum: [self_employed, ip, ooo, individual] } }
        styleTagIds: { type: array, items: { type: string }, maxItems: 5 }
        references: { type: array, items: { type: object, properties: { url: { type: string }, comment: { type: string } } } }
        workStyle:
          type: object
          properties:
            revisions: { type: string, enum: ["1", "2-3", "4+"] }
            involvement: { type: string, enum: [freedom, stages, every_step] }
            channel: { type: string, enum: [telegram, email, calls] }
            pace: { type: string, enum: [fast, thorough] }
        consent: { type: boolean }
    InvitationStatus:
      type: string
      enum: [sent, viewed, accepted, declined, expired, withdrawn, cancelled]
    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        slotKey: { type: string, format: uuid }
        specialistId: { type: string, format: uuid }
        specialistName: { type: string }
        specialistAvatarUrl: { type: [string, "null"] }
        cost: { type: integer }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        sentAt: { type: string }
        expiresAt: { type: string }
        declineReason: { type: string }
        replacesId: { type: string, format: uuid }
        phone: { type: string, description: "Только после принятия приглашения" }
    ProjectDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [draft, matching, team_selected, in_progress, delivered, cancelled] }
        version: { type: integer }
        brief: { $ref: "#/components/schemas/Brief" }
        tier: { type: string, enum: [economy, optimum, premium] }
        invitations: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        manualSlots: { type: array, items: { type: string, format: uuid }, description: "Слоты в ручном подборе" }
    ProjectListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        format: { type: string }
        city: { type: string }
        status: { type: string }
        myPart: { type: string, enum: [client, specialist] }
        myRole: { type: string }
        shootDates: { type: array, items: { type: string } }
        deliveryDate: { type: string }
        budgetMax: { type: integer, description: "Только заказчику" }
        teamFilled: { type: integer }
        teamTotal: { type: integer }
        myInvitation: { type: object, properties: { id: { type: string }, status: { $ref: "#/components/schemas/InvitationStatus" } } }
    MatchingResponse:
      type: object
      description: |
        Три состава и все кандидаты по ролям. Структура SlotResult / Configuration / Candidate —
        как в src/lib/team-search/types.ts. Балл 0–100 из 6 компонентов (портфолио 25%, роль 20%,
        бюджет 15%, надёжность 15%, занятость 10%, стиль 15%).
      properties:
        projectId: { type: string, format: uuid }
        brief: { $ref: "#/components/schemas/Brief" }
        results: { type: array, items: { type: object } }
        configs: { type: object, properties: { economy: { type: object }, optimum: { type: object }, premium: { type: object } } }
        recommended: { type: string, enum: [economy, optimum, premium] }

security:
  - session: []

paths:
  /auth/otp:
    post:
      summary: Отправить код из SMS
      description: Не чаще раза в 60 с и не больше 5 раз в час на номер. В режиме разработки код в ответе (devCode) и в терминале.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone: { type: string, example: "+7 (999) 100-99-99" }
                purpose: { type: string, enum: [signup, login] }
      responses:
        "200":
          description: Код отправлен
          content: { application/json: { schema: { type: object, properties: { resendIn: { type: integer }, devCode: { type: string } } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /auth/verify:
    post:
      summary: Проверить код; регистрация создаёт аккаунт с согласиями, вход — сессию
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, purpose]
              properties:
                phone: { type: string }
                code: { type: string, pattern: "^\\d{4,6}$" }
                purpose: { type: string, enum: [signup, login] }
                consents:
                  type: object
                  description: Обязательно при регистрации; adult, terms, pdn должны быть true
                  properties: { adult: { type: boolean }, terms: { type: boolean }, pdn: { type: boolean }, marketing: { type: boolean } }
      responses:
        "200":
          description: Вход выполнен, cookie sz_session установлена
          content: { application/json: { schema: { type: object, properties: { needsOnboarding: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Выйти (сессия отзывается в БД)
      responses: { "200": { description: OK } }
  /me:
    get:
      summary: Кто вошёл. Гостю — { me null }
      security: []
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { me: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Me" }] } } } } }
  /me/onboarding:
    post:
      summary: Имя и режимы; при первом вызове создаёт профиль и адрес страницы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, client, specialist]
              properties: { displayName: { type: string, minLength: 2, maxLength: 80 }, client: { type: boolean }, specialist: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { me: { $ref: "#/components/schemas/Me" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /me/avatar:
    post:
      summary: Своё фото в аватар. Обрезается до 512×512, старое своё фото удаляется
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: "#/components/schemas/ImageUpload" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AvatarResponse" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    put:
      summary: Готовая медведица ({ preset }) или убрать аватар ({ preset null })
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preset]
              properties: { preset: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/AvatarPreset" }] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AvatarResponse" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /media:
    post:
      summary: Загрузить картинку для портфолио (до 2000 px, WebP). Не больше 100 на человека и 30 загрузок в час
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImageUpload"
                - type: object
                  required: [purpose]
                  properties: { purpose: { const: portfolio } }
      responses:
        "201":
          description: Сохранено
          content:
            application/json:
              schema:
                type: object
                properties:
                  media: { type: object, properties: { id: { type: string, format: uuid }, url: { type: string }, width: { type: integer }, height: { type: integer } } }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /media/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Картинка. Аватары — всем, кэш «навсегда»; портфолио — пока только владельцу
      security: []
      responses:
        "200": { description: OK, content: { image/webp: { schema: { type: string, format: binary } } } }
        "304": { description: Не изменилась (If-None-Match) }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Удалить свою картинку. Если она стояла в аватаре, аватар обнулится
      responses:
        "204": { description: Удалено }
        "404": { $ref: "#/components/responses/Error" }
  /projects:
    get:
      summary: Мои проекты — где я заказчик и куда меня пригласили
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { projects: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } } } } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Новый проект-черновик из брифа
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Brief" } } } }
      responses:
        "201": { description: Создан, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid } } } } } }
        "400": { $ref: "#/components/responses/Error" }
  /projects/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      summary: Проект с брифом и приглашениями (только владельцу)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Сохранить бриф
      description: Если по текущей версии брифа уже был подбор — создаётся version+1 со своими слотами, статус возвращается в draft. После отправки приглашений — 409 locked.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Brief" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{id}/matching:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Подобрать три состава по текущей версии брифа
      description: Сохраняет team_configurations и configuration_members, ставит статус matching, создаёт заявки на ручной подбор. 422 — бриф неполный; 409 invited — приглашения уже отправлены.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MatchingResponse" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{id}/invitations:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Отправить приглашения выбранному составу
      description: Сервер сам проверяет допуск каждого кандидата и считает стоимость (candidates_for_slot). Приглашение живёт 48 часов; у специалиста не больше 3 открытых.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, members]
              properties:
                tier: { type: string, enum: [economy, optimum, premium] }
                members: { type: array, items: { type: object, properties: { slotKey: { type: string, format: uuid }, specialistId: { type: string, format: uuid } } } }
      responses:
        "201": { description: Отправлено, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{id}/team:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Зафиксировать команду (все роли, кроме ручного подбора, закрыты)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectDetail" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /invitations/{id}/replace:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Пригласить замену после отказа — следующего по баллу кандидата
      responses:
        "201": { description: Замена приглашена }
        "409": { $ref: "#/components/responses/Error" }
  /invitations/{id}/respond:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Ответ специалиста на приглашение
      description: При accept даты съёмки блокируются в календаре специалиста, контакты открываются заказчику.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [accept], properties: { accept: { type: boolean }, reason: { type: string, maxLength: 300 } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /dev/projects/{id}/simulate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      summary: Только в режиме разработки — ответы за специалистов (все принимают, кроме второго)
      responses: { "200": { description: OK } }

  # ---------- Админка: только сотрудники платформы ----------
  # Не сотрудник или гость — 404 на любой /admin/* (не подтверждаем, что админка есть).
  # Сотрудник без нужной роли — 403 forbidden. Права по ролям — src/lib/admin.ts (PERMISSIONS).
  # Изменения и просмотры карточек с телефонами пишутся в admin_audit_log. Типы ответов — src/lib/api/admin-types.ts.
  /admin/me:
    get:
      tags: [admin]
      summary: "Моя роль сотрудника { staff: { userId, role, displayName } }"
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
  /admin/summary:
    get:
      tags: [admin]
      summary: Сводка — очередь ручного подбора, пользователи, проекты по статусам, аватары на проверке
      responses: { "200": { description: OK } }
  /admin/queue:
    get:
      tags: [admin]
      summary: Очередь ручного подбора (все роли)
      parameters: [{ name: filter, in: query, schema: { type: string, enum: [active, mine, closed], default: active } }]
      responses: { "200": { description: OK } }
  /admin/queue/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin]
      summary: Заявка — бриф, приглашения в роль, кандидаты с телефонами (просмотр пишется в журнал)
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
    post:
      tags: [admin]
      summary: Действие над заявкой (admin, matcher)
      description: |
        take — взять в работу (админ может забрать чужую); release — вернуть в очередь;
        invite — пригласить специалиста от платформы (только своя заявка в работе; фильтры candidates_for_slot, лимит 3 открытых приглашения);
        done / cancel — закрыть с итогом (note ≥ 5 символов).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [action], properties: { action: { const: take } } }
                - { type: object, required: [action], properties: { action: { const: release } } }
                - { type: object, required: [action, specialistId], properties: { action: { const: invite }, specialistId: { type: string, format: uuid } } }
                - { type: object, required: [action, note], properties: { action: { enum: [done, cancel] }, note: { type: string, minLength: 5, maxLength: 1000 } } }
      responses: { "200": { description: Заявка после действия }, "403": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /admin/users:
    get:
      tags: [admin]
      summary: Поиск пользователей (телефоны замаскированы), по 50
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Имя, адрес профиля или ≥ 4 цифр телефона" }
        - { name: status, in: query, schema: { type: string, enum: [all, active, blocked, deleted] } }
        - { name: kind, in: query, schema: { type: string, enum: [all, client, specialist, staff] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: "{ users, hasMore }" } }
  /admin/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin]
      summary: Карточка пользователя с полным телефоном (просмотр пишется в журнал)
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/Error" } }
  /admin/users/{id}/block:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin]
      summary: Заблокировать (admin, moderator). Сессии отзываются, приглашения без ответа — тоже. Себя и сотрудников нельзя
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { "200": { description: "{ user, withdrawn }" }, "409": { $ref: "#/components/responses/Error" } }
  /admin/users/{id}/unblock:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin]
      summary: Разблокировать (admin, moderator)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /admin/projects:
    get:
      tags: [admin]
      summary: Все проекты, по 50
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [all, draft, matching, team_selected, in_progress, delivered, cancelled] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0 } }
      responses: { "200": { description: "{ projects, hasMore }" } }
  /admin/projects/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [admin]
      summary: Проект — роли, приглашения, ручной подбор, доступные переходы статуса, история (просмотр пишется в журнал)
      responses: { "200": { description: OK } }
  /admin/projects/{id}/status:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin]
      summary: Ручная смена статуса (только admin)
      description: |
        Переходы: team_selected → in_progress → delivered; draft | matching | team_selected | in_progress → cancelled.
        Отмена: приглашения без ответа → withdrawn, принятые → cancelled с причиной, занятость в календарях снимается, заявки ручного подбора закрываются.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status, reason], properties: { status: { type: string }, reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /admin/avatars:
    get:
      tags: [admin]
      summary: Свои фото в аватарах, ещё не проверенные (?all=1 — все) (admin, moderator)
      responses: { "200": { description: OK } }
  /admin/avatars/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [admin]
      summary: approve — оставить фото; reset — удалить фото (с причиной)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [action], properties: { action: { enum: [approve, reset] }, reason: { type: string, minLength: 3, maxLength: 500 } } } } }
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /admin/staff:
    get:
      tags: [admin]
      summary: Сотрудники, действующие и бывшие (только admin)
      responses: { "200": { description: OK } }
    post:
      tags: [admin]
      summary: Выдать или поменять роль по телефону зарегистрированного человека (себе нельзя)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, role], properties: { phone: { type: string }, role: { enum: [admin, moderator, matcher] } } } } } }
      responses: { "201": { description: OK }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /admin/staff/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [admin]
      summary: Отозвать роль (себе и последнему админу нельзя)
      responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Error" } }
  /admin/audit:
    get:
      tags: [admin]
      summary: Журнал действий сотрудников, по 100, новые сверху (только admin)
      parameters:
        - { name: entityType, in: query, schema: { type: string, enum: [user, project, match_request, staff, avatar] } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: string }, description: "id последней записи предыдущей страницы (nextBefore)" }
        - { name: views, in: query, schema: { type: string, enum: ["0", "1"], default: "1" }, description: "0 — без просмотров" }
      responses: { "200": { description: "{ entries, nextBefore }" } }
